name: Build Spectra Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            asset: SpectraLauncher-Windows.zip
          - os: macos-latest
            name: macOS
            asset: SpectraLauncher-macOS.zip
          - os: ubuntu-latest
            name: Linux
            asset: SpectraLauncher-Linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --onefile --icon icon.ico --name SpectraLauncher fabric_launcher.py
          Compress-Archive -Path dist/SpectraLauncher.exe -DestinationPath ${{ matrix.asset }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --icon icon.icns --name SpectraLauncher fabric_launcher.py
          cd dist && ditto -c -k --sequesterRsrc --keepParent SpectraLauncher.app ../${{ matrix.asset }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --name SpectraLauncher fabric_launcher.py
          cd dist && zip ../${{ matrix.asset }} SpectraLauncher

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
